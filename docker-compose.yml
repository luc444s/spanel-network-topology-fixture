services:
  frontend:
    image: python:3.12-alpine
    container_name: pos-frontend
    user: "1000:1000"
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
    expose: ["8000"]
    networks:
      frontend_net:
        aliases: [legacy-front]

  backend:
    image: python:3.12-alpine
    container_name: pos-backend
    user: "1000:1000"
    command: ["python", "-m", "http.server", "8001", "--bind", "0.0.0.0"]
    expose: ["8001"]
    networks:
      frontend_net:
        aliases: [legacy-back]
      database_net:
        aliases: [legacy-back-db]

  db:
    image: python:3.12-alpine
    container_name: pos-db
    user: "1000:1000"
    command: ["python", "-m", "http.server", "8002", "--bind", "0.0.0.0"]
    expose: ["8002"]
    networks:
      database_net:
        aliases: [legacy-db]

networks:
  frontend_net:
  database_net:
